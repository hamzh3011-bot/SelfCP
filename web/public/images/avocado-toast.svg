<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#F7F0E5"/>
      <stop offset="1" stop-color="#E0D0BB"/>
    </linearGradient>
    <radialGradient id="light" cx=".3" cy=".16" r=".8">
      <stop offset="0" stop-color="#FFFDF6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFDF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx=".42" cy=".36" r=".75">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#EADDCB"/>
    </radialGradient>
    <linearGradient id="bread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B383"/>
      <stop offset="1" stop-color="#B98C58"/>
    </linearGradient>
    <linearGradient id="avo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8B878"/>
      <stop offset="1" stop-color="#7B8F52"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#light)"/>
  <ellipse cx="500" cy="640" rx="420" ry="380" fill="#B29B7E" opacity=".3" filter="url(#shadow)"/>

  <circle cx="500" cy="640" r="392" fill="url(#plate)"/>
  <circle cx="500" cy="640" r="392" fill="none" stroke="#D6C4AD" stroke-width="4"/>
  <circle cx="500" cy="640" r="330" fill="none" stroke="#DDCDB7" stroke-width="3"/>

  <!-- toast -->
  <g transform="rotate(-7 500 640)">
    <rect x="258" y="404" width="484" height="470" rx="58" fill="url(#bread)"/>
    <rect x="258" y="404" width="484" height="470" rx="58" fill="none" stroke="#9C7343" stroke-width="8" opacity=".55"/>
    <rect x="288" y="434" width="424" height="410" rx="44" fill="#E2C39A"/>
  </g>

  <!-- avocado slices -->
  <g>
    <ellipse cx="400" cy="560" rx="98" ry="46" fill="url(#avo)" transform="rotate(-16 400 560)"/>
    <ellipse cx="400" cy="560" rx="72" ry="28" fill="#C6D49A" transform="rotate(-16 400 560)"/>
    <ellipse cx="560" cy="600" rx="100" ry="46" fill="url(#avo)" transform="rotate(10 560 600)"/>
    <ellipse cx="560" cy="600" rx="74" ry="28" fill="#C6D49A" transform="rotate(10 560 600)"/>
    <ellipse cx="452" cy="742" rx="104" ry="48" fill="url(#avo)" transform="rotate(-4 452 742)"/>
    <ellipse cx="452" cy="742" rx="76" ry="30" fill="#C6D49A" transform="rotate(-4 452 742)"/>
    <ellipse cx="604" cy="740" rx="72" ry="34" fill="url(#avo)" transform="rotate(24 604 740)"/>
    <ellipse cx="604" cy="740" rx="50" ry="20" fill="#C6D49A" transform="rotate(24 604 740)"/>
  </g>

  <!-- egg -->
  <ellipse cx="560" cy="500" rx="128" ry="106" fill="#FFFDF7"/>
  <ellipse cx="560" cy="500" rx="128" ry="106" fill="none" stroke="#EDE1CF" stroke-width="5"/>
  <circle cx="552" cy="506" r="54" fill="#E8A93F"/>
  <circle cx="536" cy="490" r="20" fill="#F3C468" opacity=".75"/>

  <!-- chilli flakes + seeds -->
  <g fill="#A9503A" opacity=".8">
    <circle cx="360" cy="660" r="7"/>
    <circle cx="336" cy="700" r="5"/>
    <circle cx="640" cy="640" r="6"/>
    <circle cx="470" cy="470" r="5"/>
  </g>
  <g fill="#EFE0C4">
    <circle cx="660" cy="700" r="7"/>
    <circle cx="676" cy="726" r="5"/>
    <circle cx="380" cy="500" r="6"/>
  </g>

  <!-- fork -->
  <g transform="rotate(-28 828 900)" fill="#D9C7AE">
    <rect x="820" y="740" width="16" height="330" rx="8"/>
    <rect x="782" y="620" width="10" height="140" rx="5"/>
    <rect x="806" y="620" width="10" height="140" rx="5"/>
    <rect x="830" y="620" width="10" height="140" rx="5"/>
    <rect x="854" y="620" width="10" height="140" rx="5"/>
    <rect x="778" y="586" width="90" height="46" rx="16"/>
  </g>

  <rect width="1000" height="1250" filter="url(#grain)" opacity=".08" style="mix-blend-mode:overlay"/>
</svg>
