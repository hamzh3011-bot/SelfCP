<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EADA"/>
      <stop offset=".55" stop-color="#E4D3BE"/>
      <stop offset="1" stop-color="#C6AC92"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF3"/>
      <stop offset=".6" stop-color="#F8E9CE"/>
      <stop offset="1" stop-color="#E8CBA3"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0.9" y2="0.5">
      <stop offset="0" stop-color="#5C3D29"/>
      <stop offset=".45" stop-color="#8A6244"/>
      <stop offset="1" stop-color="#4B3121"/>
    </linearGradient>
    <linearGradient id="cupBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF4E8"/>
      <stop offset="1" stop-color="#DCCBB4"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFDF6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFDF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".45" cy=".42" r=".8">
      <stop offset=".45" stop-color="#2C2621" stop-opacity="0"/>
      <stop offset="1" stop-color="#2C2621" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>

  <!-- window -->
  <rect x="120" y="70" width="700" height="760" rx="10" fill="url(#win)"/>
  <rect x="462" y="70" width="16" height="760" fill="#C0A385" opacity=".7"/>
  <rect x="120" y="430" width="700" height="14" fill="#C0A385" opacity=".7"/>
  <rect x="120" y="70" width="700" height="760" rx="10" fill="none" stroke="#AC8F71" stroke-width="16"/>
  <ellipse cx="430" cy="330" rx="360" ry="320" fill="url(#bloom)"/>

  <!-- light beams -->
  <g opacity=".38" filter="url(#soft)">
    <polygon points="250,90 520,90 860,860 300,900" fill="#FFF6E4" opacity=".5"/>
    <polygon points="600,90 700,90 980,880 640,900" fill="#FFF6E4" opacity=".35"/>
  </g>

  <!-- back wall shelves and cups -->
  <g opacity=".5">
    <rect x="960" y="300" width="470" height="12" rx="4" fill="#A88C6E"/>
    <rect x="960" y="520" width="470" height="12" rx="4" fill="#A88C6E"/>
    <g fill="#EFE1CE">
      <rect x="1020" y="240" width="62" height="58" rx="14"/>
      <rect x="1112" y="252" width="52" height="46" rx="12"/>
      <rect x="1192" y="228" width="70" height="70" rx="16"/>
      <rect x="1292" y="250" width="54" height="48" rx="12"/>
      <rect x="1040" y="462" width="58" height="56" rx="13"/>
      <rect x="1140" y="470" width="66" height="48" rx="12"/>
      <rect x="1240" y="456" width="52" height="62" rx="13"/>
    </g>
  </g>

  <!-- chair -->
  <g opacity=".75">
    <rect x="880" y="470" width="250" height="240" rx="26" fill="#6B4A33"/>
    <rect x="910" y="500" width="190" height="180" rx="18" fill="#7E5A40"/>
  </g>

  <!-- foreground table -->
  <path d="M-60 690 L900 668 L1180 1000 L-60 1000 Z" fill="url(#table)"/>
  <path d="M-60 690 L900 668 L906 700 L-60 722 Z" fill="#A87C57" opacity=".55"/>

  <!-- plant -->
  <g fill="#5E6B4C">
    <path d="M118 700c-8-70 10-130 54-176 12 74-4 132-54 176Z" opacity=".9"/>
    <path d="M150 716c34-58 86-92 150-100-36 66-84 100-150 100Z" opacity=".75"/>
    <path d="M104 724c-42-40-66-92-70-156 56 40 84 92 88 156Z" opacity=".65"/>
  </g>
  <path d="M60 700h150l-14 92H74Z" fill="#8C6A4B"/>

  <!-- cup on the table -->
  <ellipse cx="560" cy="790" rx="128" ry="30" fill="#2C2621" opacity=".22" filter="url(#soft2)"/>
  <ellipse cx="560" cy="778" rx="120" ry="30" fill="#F3E8D8"/>
  <path d="M478 720h164l-14 54a52 52 0 0 1-52 42h-32a52 52 0 0 1-52-42Z" fill="url(#cupBody)"/>
  <path d="M486 722h148l-3 14H489Z" fill="#FFFDF8" opacity=".8"/>
  <ellipse cx="560" cy="722" rx="82" ry="17" fill="#C08A5E"/>
  <ellipse cx="560" cy="721" rx="72" ry="13" fill="#8A5B3B"/>
  <path d="M642 736c30-6 38 12 34 28-4 16-20 22-38 18" fill="none" stroke="#E2D2BD" stroke-width="13" stroke-linecap="round"/>

  <!-- steam -->
  <g stroke="#FFF9EE" stroke-width="6" fill="none" opacity=".4" stroke-linecap="round">
    <path d="M528 700c-16-24 12-38-2-62"/>
    <path d="M574 698c-18-26 14-40-2-66"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".09" style="mix-blend-mode:overlay"/>
</svg>
