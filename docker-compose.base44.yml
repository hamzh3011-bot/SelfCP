name: harth-cafe

services:
  web:
    # Plain runtime image: the app is served from the bind-mounted source,
    # never from a prebuilt bundle, so edits are visible via Vite HMR.
    image: node:22
    labels:
      base44.project: "Harth Cafe"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    environment:
      - BASE44_PREVIEW_MODE
      # Provided by the platform; Vite (>=6.1) appends these to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  web_node_modules:
