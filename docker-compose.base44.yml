services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5000"
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python run.py"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
