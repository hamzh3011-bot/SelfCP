{% extends "admin/base.html" %}
{% block title %}تنظیمات{% endblock %}
{% block admin_header %}تنظیمات سایت و لوگو{% endblock %}

{% block admin_content %}
<form method="POST" action="{{ url_for('admin.settings') }}" enctype="multipart/form-data" class="admin-form">
    <div class="admin-panel">
        <h3 class="admin-panel-title">لوگوی سایت</h3>
        <div class="form-group">
            <label>بارگذاری لوگو</label>
            <input type="file" name="logo" accept="image/*" class="file-input">
        </div>
        {% if settings.logo_path %}
        <div class="current-logo">
            <p>لوگوی فعلی:</p>
            <img src="{{ settings.logo_path }}" alt="logo" class="logo-preview">
        </div>
        {% endif %}
    </div>
    <div class="admin-panel">
        <h3 class="admin-panel-title">اطلاعات سایت</h3>
        <div class="form-group">
            <label>نام سایت</label>
            <input type="text" name="site_name" value="{{ settings.site_name }}">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>تلفن</label>
                <input type="text" name="phone" value="{{ settings.phone or '' }}">
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" name="email" value="{{ settings.email or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>آدرس</label>
            <textarea name="address" rows="2">{{ settings.address or '' }}</textarea>
        </div>
    </div>
    <div class="admin-panel">
        <h3 class="admin-panel-title">شبکه‌های اجتماعی</h3>
        <div class="form-row">
            <div class="form-group">
                <label>اینستاگرام</label>
                <input type="text" name="instagram" value="{{ settings.instagram or '' }}">
            </div>
            <div class="form-group">
                <label>تلگرام</label>
                <input type="text" name="telegram" value="{{ settings.telegram or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>واتساپ</label>
            <input type="text" name="whatsapp" value="{{ settings.whatsapp or '' }}">
        </div>
    </div>
    <button type="submit" class="btn btn-gold btn-lg">ذخیره تنظیمات</button>
</form>
{% endblock %}
