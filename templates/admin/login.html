<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت - نیک سرش</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-body">
<div class="admin-login-card glass">
    <div class="admin-login-logo">نیک سرش</div>
    <h2>پنل مدیریت</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-container">
            {% for category, message in messages %}
            <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" name="username" required placeholder="نام کاربری">
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" name="password" required placeholder="رمز عبور">
        </div>
        <button type="submit" class="btn btn-gold btn-full btn-lg">ورود</button>
    </form>
    <a href="{{ url_for('shop.index') }}" class="admin-login-back">بازگشت به سایت</a>
</div>
</body>
</html>
