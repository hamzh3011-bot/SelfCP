{% extends "base.html" %}
{% block title %}ثبت‌نام - نیک سرش{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card glass">
        <h1 class="auth-title">ثبت‌نام</h1>
        <p class="auth-subtitle">در فروشگاه نیک سرش حساب خود را بسازید</p>
        <form method="POST" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label>نام</label>
                    <input type="text" name="first_name" required placeholder="نام">
                </div>
                <div class="form-group">
                    <label>نام خانوادگی</label>
                    <input type="text" name="last_name" required placeholder="نام خانوادگی">
                </div>
            </div>
            <div class="form-group">
                <label>شماره موبایل</label>
                <input type="text" name="phone" required placeholder="شماره موبایل">
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" name="email" required placeholder="ایمیل">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" required placeholder="رمز عبور">
            </div>
            <button type="submit" class="btn btn-gold btn-full btn-lg">ثبت‌نام</button>
        </form>
        <p class="auth-link">حساب کاربری دارید؟ <a href="{{ url_for('auth.login') }}">ورود</a></p>
    </div>
</div>
{% endblock %}
